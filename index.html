<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Solitaire</title>
  <!-- Inline so the loader shows before the bundle (and its CSS) and the skin images have arrived. -->
  <style>
    html, body { margin: 0; background: #000; }
    .loader {
      position: fixed;
      inset: 0;
      z-index: 3000;
      display: grid;
      place-items: center;
      background: #000;
      transition: opacity 300ms;
    }
    .loader.done { opacity: 0; pointer-events: none; }
    /* Track and fill; main.ts sets --p (0..1) as the bundle and the skin's images come in */
    .loader::before, .loader::after {
      content: "";
      grid-area: 1 / 1;
      width: min(200px, 50vw);
      height: 4px;
      border-radius: 2px;
      background: #fff;
    }
    .loader::before { opacity: 0.2; }
    .loader::after {
      transform: scaleX(var(--p, 0));
      transform-origin: 0 0;
      transition: transform 200ms;
    }
  </style>
</head>
<body>
  <div id="loader" class="loader" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100"></div>
  <div id="board" class="board"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
