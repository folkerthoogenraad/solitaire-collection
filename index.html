<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#565b36">
  <title>Solitaire</title>
  <!-- Inline so the loader shows before the bundle (and its CSS) and the skin images have arrived. -->
  <style>
    html, body { margin: 0; background: #565b36; }
    .loader {
      position: fixed;
      inset: 0;
      z-index: 3000;
      display: grid;
      place-items: center;
      background: radial-gradient(ellipse at 50% 25%, #6b8563, #565b36 75%);
      transition: opacity 250ms;
    }
    .loader.done { opacity: 0; pointer-events: none; }
    .loader::after {
      content: "";
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 4px solid rgb(255 255 255 / 25%);
      border-top-color: #fff;
      animation: loader-spin 0.8s linear infinite;
    }
    @keyframes loader-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loader" class="loader" role="progressbar" aria-label="Loading"></div>
  <div id="board" class="board"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
